name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: vp -C packages/core pack
      - run: vp -C packages/react pack
      - run: vp -C packages/remotion pack
      - run: |
          vp check --fix
          git diff -- docs/explicit-ranges.md packages/react/src/useAlignmentSession.ts
          exit 1
      - run: vp test
      - run: vp build
