name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: |
          vp fmt src/features/alignment/components/SetupForm.tsx
          git diff -- src/features/alignment/components/SetupForm.tsx
          exit 1
